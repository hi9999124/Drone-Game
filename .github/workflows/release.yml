name: Release

# Triggered by pushing a tag like v0.1.0-alpha.1, v0.1.0-beta.2, v0.1.0-dev.5,
# v0.1.0-preview.1, or v0.1.0 (stable). Builds a standalone executable per OS
# with PyInstaller (players don't need Python installed) and publishes them
# as assets on a GitHub Release, marked as a pre-release unless the tag has
# no "-channel" suffix.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: DronePVO-windows.zip
          - os: ubuntu-latest
            asset_name: DronePVO-linux.zip
          - os: macos-latest
            asset_name: DronePVO-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name DronePVO main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DronePVO.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release channel from tag
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-dev* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Dev" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-preview* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Preview" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "label=Stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.channel.outputs.label }} ${{ github.ref_name }}"
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*.zip
