name: Release

# Triggered either by pushing a tag like v0.1.0-alpha.1, v0.1.0-beta.2,
# v0.1.0-dev.5, v0.1.0-preview.1, v0.1.0 (stable) -- or manually via
# "Run workflow" in the Actions tab, which builds the tag name from the
# version/channel/build inputs instead. Builds a standalone executable per
# OS with PyInstaller (players don't need Python installed) and publishes
# them as assets on a GitHub Release, marked as a pre-release unless the
# channel is "stable".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.1.0"
        required: true
      channel:
        description: "Release channel"
        required: true
        default: "alpha"
        type: choice
        options:
          - dev
          - alpha
          - beta
          - preview
          - stable
      build_number:
        description: "Build number within the channel, e.g. 1"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  # Computed once and shared via outputs so the fast release job and the
  # slow Android attach job agree on the same tag without duplicating logic.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.channel.outputs.tag }}
      label: ${{ steps.channel.outputs.label }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Determine release tag and channel
        id: channel
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANNEL="${{ github.event.inputs.channel }}"
            BUILD="${{ github.event.inputs.build_number }}"
            if [[ "$CHANNEL" == "stable" ]]; then
              TAG="v${VERSION}"
            else
              TAG="v${VERSION}-${CHANNEL}.${BUILD}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == *-dev* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Dev" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-preview* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "label=Preview" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "label=Stable" >> "$GITHUB_OUTPUT"
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: DronePVO-windows.zip
          - os: ubuntu-latest
            asset_name: DronePVO-linux.zip
          - os: macos-latest
            asset_name: DronePVO-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name DronePVO main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DronePVO.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  build-android:
    # Pinned to 22.04, not ubuntu-latest (now 24.04): python-for-android's
    # libffi recipe ships a vendored configure.ac that calls the libtool
    # macro LT_SYS_SYMBOL_USCORE, which fails to resolve against the newer
    # autotools/libtool on 24.04 ("possibly undefined macro"). 22.04 ships
    # versions the recipe was actually written against. This is a known
    # p4a/Buildozer-on-24.04 incompatibility, not something buildozer.spec
    # can work around.
    runs-on: ubuntu-22.04
    # Buildozer/python-for-android is a much less battle-tested pipeline than
    # PyInstaller, and a cold SDK/NDK download can take 20-40 minutes. It
    # must not hold up publishing the desktop builds or the release itself
    # showing up as "Latest" -- see the two-stage release/attach-android
    # split below.
    continue-on-error: true
    outputs:
      # NOT the same as this job's own pass/fail: continue-on-error means
      # needs.build-android.result reads as "success" downstream even when
      # the job actually failed, so attach-android can't gate on that. This
      # output is set for real only if "Collect APK" (i.e. the actual build)
      # succeeded, and is what attach-android checks instead.
      apk_built: ${{ steps.apk_status.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Buildozer needs a JDK. Installing it via setup-java avoids the
      # unmaintained third-party action that pulled in ppa:openjdk-r, whose
      # Release file 404s on current Ubuntu and broke the whole Docker build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK/NDK is a multi-GB download; caching it turns a ~30
      # minute first build into a few minutes on later runs.
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Collect APK
        run: cp bin/*.apk DronePVO-android.apk

      # Only reached if every previous step (including Collect APK) actually
      # succeeded -- see the outputs: comment above for why this can't be
      # `needs.build-android.result` in the downstream job instead.
      - name: Mark APK built
        id: apk_status
        if: success()
        run: echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DronePVO-android.apk
          path: DronePVO-android.apk

  # Publishes as soon as the (fast, reliable) desktop builds are ready, so
  # the release shows up as "Latest" within a couple of minutes instead of
  # waiting on the (slow, less reliable) Android build below.
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DronePVO-*.zip
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.label }} ${{ needs.prepare.outputs.tag }}"
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          # GitHub only auto-promotes a release to "Latest" if it's NOT a
          # prerelease -- with every release so far being alpha/dev/etc,
          # none ever became "Latest", so the repo sidebar fell back to a
          # bare tag-count widget instead of a release card. "Latest" and
          # "Pre-release" are independent flags: forcing this true means the
          # newest release of ANY channel shows as Latest, with a Pre-release
          # pill next to it when it's not a stable build.
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/*.zip

  # Runs after build-android finishes (success OR failure, since it's
  # continue-on-error) and, only on success, uploads the APK onto the
  # release that "release" already published. Re-running action-gh-release
  # against the same tag adds files to the existing release rather than
  # creating a second one.
  #
  # Gates on build-android's own `apk_built` output, NOT
  # needs.build-android.result: because build-android has
  # continue-on-error: true, GitHub Actions reports its `result` to
  # downstream jobs as "success" even when it actually failed (that's the
  # whole point of continue-on-error -- it's meant to not block dependents).
  # Using `result` here previously caused this job to run and fail even
  # though build-android had failed, trying to download an artifact that
  # was never uploaded.
  attach-android:
    needs: [prepare, build-android, release]
    if: needs.build-android.outputs.apk_built == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DronePVO-android.apk
          path: artifacts

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          fail_on_unmatched_files: false
          files: artifacts/*.apk
