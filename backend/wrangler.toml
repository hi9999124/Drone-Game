name = "dronepvo-backend"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Filled in after `wrangler d1 create dronepvo` -- see backend/README.md.
[[d1_databases]]
binding = "DB"
database_name = "dronepvo"
database_id = "d19fea84-ac7b-484d-b773-188c74704820"

# Stage 4: internet room play (public/private rooms, WebSocket relay).
# No setup needed beyond deploying -- unlike D1, Durable Objects don't need
# a separate create-and-paste-the-ID step.
[[durable_objects.bindings]]
name = "ROOM_RELAY"
class_name = "RoomRelay"

[[durable_objects.bindings]]
name = "ROOM_DIRECTORY"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomRelay", "RoomDirectory"]
